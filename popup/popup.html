<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Reversa</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Reversa</h1>
      <p>Configure como você quer ver o Instagram.</p>
    </header>

    <main>
      <div class="setting-block">
        <label class="toggle-row">
          <span>Rolagem não infinita</span>
          <input type="checkbox" id="scrollLimiter" />
        </label>
        <div class="slider-row" id="scrollLimiterSliderRow">
          <input
            type="range"
            id="scrollLimiterMinutes"
            min="1"
            max="15"
            step="1"
          />
          <span id="scrollLimiterMinutesValue" class="slider-value"
            >5 min</span
          >
        </div>
      </div>

      <label class="toggle-row">
        <span>Feed cronológico</span>
        <input type="checkbox" id="chronoFeed" />
      </label>

      <label class="toggle-row">
        <span>Mostrar apenas quem você segue</span>
        <input type="checkbox" id="followOnlyFilter" />
      </label>

      <label class="toggle-row">
        <span>Autoplay</span>
        <input type="checkbox" id="autoplayReset" />
      </label>

      <label class="toggle-row">
        <span>Notificações</span>
        <input type="checkbox" id="notificationsReset" />
      </label>
    </main>

    <footer>
      <p>Extensão de código aberto — Todas Labs</p>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
