<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Reversa</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Reversa</h1>
      <p>Configurações padrão a seu favor, no Instagram.</p>
    </header>

    <main>
      <label class="toggle-row">
        <span>Rolagem não infinita</span>
        <input type="checkbox" id="scrollLimiter" />
      </label>

      <label class="toggle-row">
        <span>Feed cronológico</span>
        <input type="checkbox" id="chronoFeed" />
      </label>

      <label class="toggle-row">
        <span>Mostrar apenas quem você segue</span>
        <input type="checkbox" id="followOnlyFilter" />
      </label>

      <label class="toggle-row">
        <span>Desativar autoplay e notificações</span>
        <input type="checkbox" id="settingsReset" />
      </label>
    </main>

    <footer>
      <p>Extensão de código aberto — Todas Labs</p>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
